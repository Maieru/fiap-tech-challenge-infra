name: Terraform stage
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      operation:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      role_arn:
        type: string
        required: true
    secrets:
      NEW_RELIC_LICENSE_KEY:
        required: false
      REPOSITORIES_TOKEN:
        required: false
    outputs:
      api_endpoint:
        value: ${{ jobs.terraform.outputs.api_endpoint }}
      bootstrap_servers:
        value: ${{ jobs.terraform.outputs.bootstrap_servers }}
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    if: github.repository == 'Maieru/fiap-tech-challenge' && github.ref == 'refs/heads/main'
    outputs:
      api_endpoint: ${{ steps.stage.outputs.api_endpoint }}
      bootstrap_servers: ${{ steps.stage.outputs.bootstrap_servers }}
    env:
      AWS_REGION: us-east-1
      STAGE: ${{ inputs.stage }}
      OPERATION: ${{ inputs.operation }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Maieru/fiap-tech-challenge-infra
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Autenticar AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.0
          terraform_wrapper: false
      - name: Validar, planejar e aplicar no mesmo runner
        id: stage
        shell: bash
        run: bash scripts/platform/terraform-stage.sh
      - name: Diagnosticar falha das configuracoes Kubernetes
        if: failure() && inputs.stage == 'kubernetes-configs'
        timeout-minutes: 5
        run: |
          bash scripts/platform/install-kubectl.sh
          node scripts/platform/diagnose-kubernetes-configs.mjs
