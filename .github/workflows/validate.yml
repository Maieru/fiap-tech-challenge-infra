name: Validate infrastructure
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stage:
          - bootstrap
          - aws-resources
          - kubernetes-addons
          - kubernetes-configs
          - messaging
          - api-gateway
    env:
      TF_IN_AUTOMATION: "true"
      STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.0
          terraform_wrapper: false
      - name: Validate without AWS backend or credentials
        shell: bash
        run: |-
          terraform -chdir="infra/$STAGE" fmt -check
          terraform -chdir="infra/$STAGE" init -backend=false -input=false
          terraform -chdir="infra/$STAGE" validate -no-color
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-${{ matrix.stage }}
  scripts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check platform scripts
        shell: bash
        run: |-
          for file in scripts/platform/*.sh; do bash -n "$file"; done
          for file in scripts/platform/*.mjs; do node --check "$file"; done
