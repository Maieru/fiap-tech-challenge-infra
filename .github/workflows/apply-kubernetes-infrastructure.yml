name: Apply Kubernetes Infrastructure

on:
  workflow_call:
    secrets:
      INFRA_ACTION_ROLE:
        required: true
      NEW_RELIC_LICENSE_KEY:
        required: true
      REPOSITORIES_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure-production
  cancel-in-progress: false

jobs:
  kubernetes-addons:
    name: Kubernetes Add-ons
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: kubernetes-addons
    secrets:
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      INFRA_ACTION_ROLE: ${{ secrets.INFRA_ACTION_ROLE }}
      REPOSITORIES_TOKEN: ${{ secrets.REPOSITORIES_TOKEN }}

  kubernetes-configs:
    name: Kubernetes Configs
    needs: kubernetes-addons
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: kubernetes-configs
    secrets:
      INFRA_ACTION_ROLE: ${{ secrets.INFRA_ACTION_ROLE }}
      REPOSITORIES_TOKEN: ${{ secrets.REPOSITORIES_TOKEN }}
