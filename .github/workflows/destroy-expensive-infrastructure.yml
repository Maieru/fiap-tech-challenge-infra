name: Destroy Expensive Infrastructure

on:
  workflow_call:
    secrets:
      INFRA_ACTION_ROLE:
        required: true
      jwt_signing_key:
        required: true
      REPOSITORIES_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure-production
  cancel-in-progress: false

jobs:
  check_eks:
    name: Check EKS
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.eks.outputs.exists }}
    steps:
      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.INFRA_ACTION_ROLE }}

      - name: Verificar existência do EKS
        id: eks
        shell: bash
        run: |
          exists=$(aws eks list-clusters \
            --query "contains(clusters, 'fiap-eks-cluster')" \
            --output text)
          echo "exists=${exists,,}" >> "$GITHUB_OUTPUT"

  disable_eks:
    name: Disable EKS
    needs: check_eks
    if: needs.check_eks.outputs.exists == 'true'
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: aws-resources
      operation: apply
      create_eks_instance: false
    secrets:
      INFRA_ACTION_ROLE: ${{ secrets.INFRA_ACTION_ROLE }}
      jwt_signing_key: ${{ secrets.jwt_signing_key }}
      REPOSITORIES_TOKEN: ${{ secrets.REPOSITORIES_TOKEN }}
