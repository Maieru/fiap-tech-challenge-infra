apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
  namespace: fiap-messaging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [fiap-os, fiap-execution, fiap-billing]
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [fiap-os, fiap-execution, fiap-billing]
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-init
      ports:
        - protocol: TCP
          port: 9092
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
