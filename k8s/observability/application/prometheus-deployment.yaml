apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fiap-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        fiap.tech-challenge/observability-config-checksum: "${observability_config_checksum}"
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --enable-feature=otlp-write-receiver
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - { name: http, containerPort: 9090 }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
