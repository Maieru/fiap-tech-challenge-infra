apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: fiap-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
      annotations:
        fiap.tech-challenge/observability-config-checksum: "${observability_config_checksum}"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.0.0
          args:
            - --set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317
            - --set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318
          env:
            - name: JAEGER_V2_MODE
              value: all-in-one
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
