apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: fiap-mongodb
spec:
  serviceName: mongodb
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      annotations:
        checksum/scripts: ${scripts_checksum}
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-security-files
          image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
          command: [/bin/sh, -ec]
          args:
            - cp /source/keyfile /source/server_pem /source/ca_pem /security/; chmod 400 /security/*
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: security, mountPath: /security}
      containers:
        - name: mongodb
          image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
          command: [/bin/sh, /scripts/start.sh]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: mongodb-server, key: username}
            - name: MONGO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: mongodb-server, key: password}
            - name: MONGO_REPLICA_HOST
              value: mongodb-0.mongodb.fiap-mongodb.svc.cluster.local:27017
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: '1', memory: 1Gi}
          startupProbe:
            exec:
              command: [mongosh, --nodb, --quiet, /scripts/health.js]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [mongosh, --nodb, --quiet, /scripts/health.js]
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: mongodb}
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: security, mountPath: /security, readOnly: true}
      volumes:
        - name: source
          secret: {secretName: mongodb-server}
        - name: security
          emptyDir: {medium: Memory}
        - name: scripts
          configMap: {name: mongodb-scripts}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: fiap-mongodb-gp3
        resources:
          requests: {storage: 20Gi}
