apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-server
  namespace: fiap-mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: mongodb-server
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: fiap-mongodb-admin
