apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-ingress
  namespace: fiap-mongodb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fiap-execution
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fiap-execution
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fiap-data-bootstrap
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
      ports:
        - protocol: TCP
          port: 27017
